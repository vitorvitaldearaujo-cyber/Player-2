<!doctype html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0b0c10" id="tc">
<meta name="mobile-web-app-capable" content="yes">
<title>Minha Música</title>
<style>
:root{--acc:#8b7bff;--fs:15px;--r:16px;--bot:128px}
[data-theme=dark]{--bg:#0b0c10;--bg2:#14161d;--bg3:#1c1f29;--tx:#f2f3f7;--mut:#9a9fb0;--line:rgba(255,255,255,.08);--sh:0 10px 30px rgba(0,0,0,.45);color-scheme:dark}
[data-theme=amoled]{--bg:#000;--bg2:#0c0c0e;--bg3:#17171b;--tx:#f5f5f7;--mut:#8d909c;--line:rgba(255,255,255,.1);--sh:0 10px 30px rgba(0,0,0,.6);color-scheme:dark}
[data-theme=light]{--bg:#f3f4f9;--bg2:#fff;--bg3:#e8eaf3;--tx:#161824;--mut:#6a6f82;--line:rgba(0,0,0,.08);--sh:0 10px 30px rgba(30,30,70,.14);color-scheme:light}
[data-theme=sepia]{--bg:#f1e6cd;--bg2:#f8efdb;--bg3:#e6d9ba;--tx:#3b2f1e;--mut:#7d6c52;--line:rgba(60,40,10,.12);--sh:0 10px 30px rgba(80,50,10,.18);color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--tx);font:400 var(--fs)/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:inherit}
input,textarea,select{font:inherit;color:inherit}
h1{font-size:1.9em;font-weight:800;letter-spacing:-.02em}h2{font-size:1.15em}h3{font-size:1.08em;font-weight:700}h4{margin:2px 0 10px;color:var(--mut);font-weight:600;text-transform:uppercase;letter-spacing:.06em;font-size:.75em}
[hidden]{display:none!important}
svg{display:block;flex:none}
.mut{color:var(--mut)}.sm{font-size:.84em}.sp{flex:1}.pad{padding:10px 18px}.pad0{padding:0 0 10px}
.tx{min-width:0;flex:1}.t,.s{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.t{font-weight:600}.s{color:var(--mut);font-size:.85em}
.row{display:flex;gap:10px;align-items:center}.row.end{justify-content:flex-end;margin-top:14px}

/* ---- botões ---- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 18px;border-radius:999px;background:var(--bg3);font-weight:600;transition:transform .12s,opacity .12s}
.btn:active{transform:scale(.96)}.btn.p{background:var(--acc);color:var(--onacc,#fff)}.btn.sm{padding:7px 13px;font-size:.88em}.btn.big{width:100%;padding:15px;font-size:1.02em;margin-top:10px}.btn.dng{background:#e5484d;color:#fff}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.ic{display:inline-grid;place-items:center;width:42px;height:42px;border-radius:50%;flex:none;color:inherit}.ic:active{background:var(--line)}.ic.sm{width:34px;height:34px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 18px 12px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}.chips.wrap{flex-wrap:wrap;overflow:visible;padding-left:0;padding-right:0}
.chip{flex:none;padding:8px 15px;border-radius:999px;background:var(--bg2);border:1px solid var(--line);font-size:.9em;font-weight:600;white-space:nowrap}.chip.on{background:var(--acc);border-color:var(--acc);color:var(--onacc,#fff)}.chip.sv{border-style:dashed;color:var(--acc)}

/* ---- estrutura ---- */
#pages{position:fixed;inset:0;overflow-y:auto;overflow-x:hidden;padding:max(env(safe-area-inset-top),14px) 0 calc(var(--bot) + 18px);-webkit-overflow-scrolling:touch}
.tab{display:none}.tab.active{display:block;animation:fi .25s}@keyframes fi{from{opacity:0;transform:translateY(6px)}}
.hhead{display:flex;align-items:center;justify-content:space-between;padding:8px 18px 14px}.hhead .hact{display:flex;gap:2px}
#nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(22px) saturate(1.4);-webkit-backdrop-filter:blur(22px) saturate(1.4);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:30}
#nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.68em;color:var(--mut);padding:5px 0;border-radius:12px;font-weight:600}
#nav button span{display:block}
#nav button.on{color:var(--acc)}#nav button.on svg{transform:translateY(-1px) scale(1.08)}#nav svg{transition:transform .2s}
#mini{position:fixed;left:8px;right:8px;bottom:calc(58px + env(safe-area-inset-bottom) + 6px);height:60px;z-index:29;border-radius:16px;background:color-mix(in srgb,var(--bg3) 88%,var(--acc));box-shadow:var(--sh);overflow:hidden;display:flex;align-items:center}
#mMain{display:flex;align-items:center;gap:11px;flex:1;min-width:0;padding:6px 6px 6px 8px;height:100%;touch-action:pan-y}
#mCv{width:46px;height:46px;border-radius:10px;flex:none}
#mBar{position:absolute;left:0;bottom:0;height:3px;background:var(--acc);width:0;transition:width .3s linear}
#mini .ic{width:46px;height:46px}
body.plopen #mini,body.plopen #nav{visibility:hidden}

/* ---- capas ---- */
.cv{position:relative;background:linear-gradient(135deg,var(--c1,#555),var(--c2,#222));background-size:cover;background-position:center;border-radius:10px;display:grid;place-items:center;color:rgba(255,255,255,.75);flex:none;overflow:hidden}
.cv i{display:grid;place-items:center;font-style:normal}
.cv.s48{width:48px;height:48px}.cv.s56{width:56px;height:56px;border-radius:12px}.cv.s64{width:64px;height:64px}.cv.s96{width:96px;height:96px}.cv.s120{width:120px;height:120px;border-radius:14px}.cv.s140{width:140px;height:140px;border-radius:16px}
.cv.sq{width:100%;aspect-ratio:1;border-radius:14px}.cv.rnd,.mos.rnd{border-radius:50%}.cv.s-fill{width:100%;aspect-ratio:1;border-radius:16px}
.mos{display:grid;grid-template-columns:1fr 1fr;gap:1px;overflow:hidden;border-radius:14px;background:#000;flex:none}
.mos .cv{width:100%;height:100%;border-radius:0}.mos.s120{width:120px;height:120px}.mos.s140{width:140px;height:140px;border-radius:16px}.mos.s-fill{width:100%;aspect-ratio:1;border-radius:16px}
.cv.smartc,.cv.nw{color:#fff}.cv.nw{background:var(--bg3);color:var(--acc);border:2px dashed var(--line)}
.cv.fold{color:#cdd6e8}

/* ---- linhas de faixa ---- */
.srows{padding:0 6px}
.trow{display:flex;align-items:center;gap:12px;padding:8px 10px 8px 12px;border-radius:14px;cursor:pointer}
.trow:active{background:var(--line)}.trow.cur{background:color-mix(in srgb,var(--acc) 16%,transparent)}.trow.cur .t{color:var(--acc)}.trow.sel{background:color-mix(in srgb,var(--acc) 22%,transparent)}.trow.bad{opacity:.45}
.trow .dur{color:var(--mut);font-size:.82em;font-variant-numeric:tabular-nums}
.trow em{font-style:normal;font-size:.62em;font-weight:800;letter-spacing:.04em;padding:2px 5px;border-radius:5px;margin-left:7px;vertical-align:2px}
em.hr{background:linear-gradient(90deg,#ffd24d,#ff9f45);color:#3a2500}em.ll{background:color-mix(in srgb,var(--acc) 25%,transparent);color:var(--acc)}
.fv{color:#ff4d8d;margin-left:6px;display:inline-block;vertical-align:-1px}
.chk{width:22px;height:22px;border-radius:50%;border:2px solid var(--mut);display:grid;place-items:center;flex:none;color:#fff}.trow.sel .chk{background:var(--acc);border-color:var(--acc);color:var(--onacc,#fff)}
#selbar{position:fixed;left:0;right:0;top:0;z-index:40;display:flex;align-items:center;gap:8px;padding:max(env(safe-area-inset-top),8px) 10px 8px;background:var(--bg2);border-bottom:1px solid var(--line);box-shadow:var(--sh)}
#selbar b{font-size:1.1em}
.tool{display:flex;align-items:center;gap:8px;padding:2px 18px 10px}

/* ---- início ---- */
.resume{display:flex;align-items:center;gap:14px;width:calc(100% - 36px);margin:0 18px 16px;padding:12px;border-radius:20px;background:linear-gradient(120deg,color-mix(in srgb,var(--c1) 55%,var(--bg2)),var(--bg2));box-shadow:var(--sh)}
.resume small{color:var(--mut);font-size:.75em;text-transform:uppercase;letter-spacing:.06em}.resume .rp{width:46px;height:46px;border-radius:50%;background:var(--acc);color:var(--onacc,#fff);display:grid;place-items:center}
.qgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 18px 12px}
.qt{display:flex;align-items:center;gap:12px;padding:12px;border-radius:16px;background:var(--bg2);border:1px solid var(--line)}.qt:active{transform:scale(.97)}
.qi{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:color-mix(in srgb,var(--c1) 22%,transparent);color:var(--c1)}
.sec{margin:8px 0 6px}.sech{display:flex;align-items:center;justify-content:space-between;padding:6px 18px}.sech button{color:var(--acc);font-size:.85em;font-weight:600}
.hs{display:flex;gap:12px;overflow-x:auto;padding:4px 18px 10px;scrollbar-width:none}.hs::-webkit-scrollbar{display:none}
.mixc,.acard{display:flex;flex-direction:column;gap:5px;width:130px;flex:none}.mixc b,.acard b{font-size:.9em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.mixc small,.acard small{color:var(--mut);font-size:.78em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mixc .mos-wrap{padding:5px;border-radius:18px;background:color-mix(in srgb,var(--c1) 35%,var(--bg2));width:130px;height:130px;display:grid;place-items:center}
.acard.rnd{align-items:center;text-align:center}.acard.rnd .cv{width:112px}
.statcard{display:flex;align-items:center;gap:14px;width:calc(100% - 36px);margin:14px 18px;padding:16px;border-radius:18px;background:linear-gradient(120deg,color-mix(in srgb,var(--acc) 30%,var(--bg2)),var(--bg2))}
.statcard span{width:46px;height:46px;border-radius:14px;background:var(--acc);color:var(--onacc,#fff);display:grid;place-items:center}.statcard small{display:block;color:var(--mut)}
.welcome{padding:22px 22px 10px;text-align:center}.welcome .wi{width:96px;height:96px;margin:10px auto 14px;border-radius:30px;background:linear-gradient(135deg,var(--acc),#ff5fa2);color:#fff;display:grid;place-items:center;box-shadow:0 14px 34px color-mix(in srgb,var(--acc) 45%,transparent)}
.welcome h2{font-size:1.5em;margin-bottom:8px}.welcome p{color:var(--mut)}
.tip{text-align:left;margin-top:20px;padding:16px;border-radius:16px;background:var(--bg2);border:1px solid var(--line);font-size:.92em}.tip ol{margin:8px 0 8px 20px}.tip li{margin:4px 0}
.fmts{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:18px}.fmts span{font-size:.76em;font-weight:700;padding:5px 10px;border-radius:999px;background:var(--bg3);color:var(--mut)}
.empty{text-align:center;padding:36px 24px;color:var(--mut)}.empty .big{opacity:.5;margin-bottom:8px;display:grid;place-items:center}.empty .btn{margin-top:14px}

/* ---- biblioteca, listas, grades ---- */
.agrid,.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:16px 14px;padding:4px 18px}
.agrid .acard,.pgrid .pc{width:100%}.pc{display:flex;flex-direction:column;gap:5px;min-width:0}.pc b{font-size:.92em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pc small{color:var(--mut);font-size:.78em}
.alist{padding:0 8px}.arow{display:flex;align-items:center;gap:14px;width:100%;padding:8px 10px;border-radius:14px}.arow:active{background:var(--line)}
.ggrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:4px 18px}.gt{position:relative;height:84px;padding:12px;border-radius:16px;background:linear-gradient(135deg,var(--c1),color-mix(in srgb,var(--c1) 40%,#000));color:#fff;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden}.gt small{opacity:.8;font-size:.75em}
.sbar{display:flex;align-items:center;gap:8px;margin:0 18px 12px;padding:2px 8px 2px 14px;border-radius:999px;background:var(--bg2);border:1px solid var(--line)}.sbar.sticky{position:sticky;top:0;z-index:5;margin-top:4px}.sbar input{flex:1;min-width:0;background:none;border:0;outline:0;padding:12px 4px}.sbar .si{color:var(--mut)}
.mrow{display:flex;align-items:center;gap:14px;width:100%;padding:12px 18px}.mrow:active{background:var(--line)}.mi-ic{width:42px;height:42px;border-radius:13px;background:color-mix(in srgb,var(--acc) 18%,transparent);color:var(--acc);display:grid;place-items:center;flex:none}.chev{color:var(--mut);font-size:1.4em}
.profile{display:flex;align-items:center;gap:14px;margin:0 18px 14px;padding:14px;border-radius:18px;background:var(--bg2);border:1px solid var(--line)}.profile small{color:var(--mut);display:block}
.av{width:50px;height:50px;border-radius:50%;background:linear-gradient(135deg,var(--acc),#ff5fa2);color:#fff;font-weight:800;font-size:1.3em;display:grid;place-items:center;flex:none}
.mlist{background:var(--bg2);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}

/* ---- páginas sobrepostas ---- */
#ovl{position:fixed;inset:0;z-index:75;pointer-events:none}
.ovp{position:absolute;inset:0;background:var(--bg);transform:translateX(100%);transition:transform .26s cubic-bezier(.3,.8,.3,1);pointer-events:auto;display:flex;flex-direction:column}.ovp.in{transform:none}
.ovh{display:flex;align-items:center;gap:6px;padding:max(env(safe-area-inset-top),8px) 10px 8px;border-bottom:1px solid var(--line);background:var(--bg)}.ovh h2{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ova{display:flex}
.ovb{flex:1;overflow-y:auto;padding:14px 0 calc(var(--bot) + 14px)}
.dh{display:flex;gap:16px;align-items:flex-end;padding:6px 18px 14px}.dti{min-width:0}.dti h1{font-size:1.4em;line-height:1.15;word-break:break-word}
.dact{display:flex;gap:8px;padding:0 18px 12px;flex-wrap:wrap}.dact .btn.p{flex:1}
.card{margin:0 18px 14px;padding:16px;border-radius:18px;background:var(--bg2);border:1px solid var(--line)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}.tile{padding:12px;border-radius:14px;background:var(--bg3)}.tile small{display:block;color:var(--mut);font-size:.75em}.tile b{font-size:1.25em}
.ir{display:flex;justify-content:space-between;gap:14px;padding:9px 0;border-bottom:1px solid var(--line)}.ir:last-child{border:0}.ir span{color:var(--mut)}.ir b{font-weight:600;text-align:right;word-break:break-word}.ir b.ok{color:#4ade80}.ir b.no{color:#ff6b6b}
.warn{color:#ffb020}
.wk{display:flex;align-items:flex-end;gap:8px;height:110px}.wk div{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px}.wk i{display:block;width:100%;min-height:3px;border-radius:6px;background:var(--acc)}.wk small{color:var(--mut);font-size:.7em}

/* ---- folhas (bottom sheet) ---- */
#sheetbg{position:fixed;inset:0;background:rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .22s;z-index:80}#sheetbg.show{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:0;right:0;bottom:0;max-height:88dvh;z-index:81;background:var(--bg2);border-radius:24px 24px 0 0;box-shadow:var(--sh);transform:translateY(105%);transition:transform .28s cubic-bezier(.3,.8,.3,1);display:flex;flex-direction:column}#sheet.open{transform:none}
#sheet .grab{width:40px;height:4px;border-radius:4px;margin:9px auto 4px;flex:none;background:var(--mut);opacity:.4}
#sheetc{overflow-y:auto;padding:8px 18px calc(18px + env(safe-area-inset-bottom))}
.shT{margin:6px 0 12px}.menu{display:flex;flex-direction:column;margin:0 -8px}.mi{display:flex;align-items:center;gap:16px;padding:13px 10px;border-radius:12px;color:var(--tx)}.mi:active{background:var(--line)}.mi svg{color:var(--mut)}.mi.dng,.mi.dng svg{color:#ff6b6b}
.plnew{display:flex;gap:8px;margin-bottom:12px}
#sheetc input:not([type=range]):not([type=checkbox]),#sheetc textarea,#pkq{width:100%;padding:11px 13px;border-radius:12px;background:var(--bg3);border:1px solid var(--line);outline:0;margin:4px 0 8px}
.plnew input{flex:1;min-width:0;width:auto!important;margin:0!important}
#sheetc label.f{display:block;font-size:.8em;color:var(--mut);margin-top:4px}
#sheetc textarea{min-height:200px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.edcv{display:flex;gap:14px;align-items:center;margin-bottom:12px}
.pkbar{position:sticky;bottom:0;padding-top:10px;background:var(--bg2)}.pkbar .btn{width:100%}
.imp{padding-top:4px}.ibar{height:8px;border-radius:8px;background:var(--bg3);overflow:hidden;margin:14px 0 10px}.ibar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acc),#ff5fa2);transition:width .2s}
.stars{display:flex;gap:4px;justify-content:center;margin:6px 0 14px}.stars button{color:var(--mut)}.stars button.on{color:#ffc24d}

/* ---- controles ---- */
.sw{display:flex;align-items:center;gap:14px;cursor:pointer;position:relative}.sw input{position:absolute;opacity:0;pointer-events:none}
.sw i{width:46px;height:28px;border-radius:28px;background:var(--bg3);border:1px solid var(--line);position:relative;flex:none;transition:.2s}.sw i::after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:var(--mut);transition:.2s}
.sw input:checked+i{background:var(--acc);border-color:var(--acc)}.sw input:checked+i::after{transform:translateX(18px);background:#fff}
.sw span{flex:1;font-weight:600}.sw span small{display:block;font-weight:400;color:var(--mut);font-size:.8em}.sw.row2{padding:10px 0}
.slr{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:8px 0}.slr span{font-weight:600}.slr b{color:var(--acc);font-variant-numeric:tabular-nums}.slr input{grid-column:1/-1}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:28px;background:transparent;outline:0}
input[type=range]::-webkit-slider-runnable-track{height:5px;border-radius:5px;background:var(--bg3)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:#fff;margin-top:-7.5px;box-shadow:0 2px 6px rgba(0,0,0,.4)}
input[type=range]::-moz-range-track{height:5px;border-radius:5px;background:var(--bg3)}input[type=range]::-moz-range-thumb{width:20px;height:20px;border:0;border-radius:50%;background:#fff}
.themes{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.th{display:flex;flex-direction:column;align-items:center;gap:7px;padding:10px 4px;border-radius:14px;border:2px solid var(--line);font-size:.8em;font-weight:600}.th.on{border-color:var(--acc)}.th i{width:34px;height:34px;border-radius:50%;border:1px solid var(--line)}
.ibar i.ind{width:35%!important;animation:ind 1.1s ease-in-out infinite alternate}@keyframes ind{from{margin-left:0}to{margin-left:65%}}
.fdrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}.fdrow .tx{flex:1;min-width:0}.fdrow .t{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.fdrow .s{color:var(--mut);font-size:.8em}
.swg{display:grid;grid-template-columns:repeat(auto-fill,minmax(68px,1fr));gap:10px 6px;margin:4px 0 8px}
.swb{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:.7em;font-weight:600;color:var(--mut);padding:4px 0;border-radius:12px}
.swb i{display:block;width:40px;height:40px;border-radius:50%;box-shadow:inset 0 0 0 2px rgba(255,255,255,.14);transition:transform .15s;position:relative}
.swb.on{color:var(--fg)}.swb.on i{outline:3px solid var(--acc);outline-offset:3px;transform:scale(1.04)}
.swb.on i::after{content:"";position:absolute;left:50%;top:50%;width:11px;height:6px;margin:-5px 0 0 -6px;border-left:3px solid #fff;border-bottom:3px solid #fff;transform:rotate(-45deg);filter:drop-shadow(0 1px 2px rgba(0,0,0,.6))}
.swb.cus i{background:conic-gradient(#ff4d4d,#ffb020,#ffe14d,#4ade80,#38c6ff,#8b7bff,#ff5fa2,#ff4d4d)}
.swb.cus input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.accnote{font-size:.78em;color:var(--mut);margin:2px 0 4px}
.sw-row{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:6px}.swc{width:38px;height:38px;border-radius:50%;border:3px solid transparent;outline:2px solid transparent}.swc.on{outline-color:var(--tx)}
.chain{display:flex;flex-direction:column;align-items:stretch}.chain .cs{padding:10px 14px;border-radius:14px;background:var(--bg3)}.chain .cs small{display:block;color:var(--mut);font-size:.75em}.chain .cs b{font-weight:700;display:block}.chain .cs span{display:block}.chain .ar{text-align:center;color:var(--acc);line-height:1.4;font-weight:800}
/* equalizador */

let DB;
function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open('minha-musica-v2',1);r.onupgradeneeded=()=>{const d=r.result;d.createObjectStore('tracks',{keyPath:'id'});d.createObjectStore('blobs');d.createObjectStore('covers',{keyPath:'key'});d.createObjectStore('playlists',{keyPath:'id'});d.createObjectStore('history',{autoIncrement:true});d.createObjectStore('kv')};r.onsuccess=()=>{DB=r.result;res()};r.onerror=()=>rej(r.error)})}
const idb=(store,mode,fn)=>new Promise((res,rej)=>{const t=DB.transaction(store,mode);let out;const r=fn(Array.isArray(store)?store.map(n=>t.objectStore(n)):t.objectStore(store));if(r&&'onsuccess'in r)r.onsuccess=()=>out=r.result;t.oncomplete=()=>res(out);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)});
const dbGet=(s,k)=>idb(s,'readonly',o=>o.get(k)),dbPut=(s,v,k)=>idb(s,'readwrite',o=>k===undefined?o.put(v):o.put(v,k)),dbDel=(s,k)=>idb(s,'readwrite',o=>o.delete(k)),dbAll=s=>idb(s,'readonly',o=>o.getAll()),dbClear=s=>idb(s,'readwrite',o=>o.clear());
const dbPutMany=(s,arr)=>idb(s,'readwrite',o=>{arr.forEach(v=>o.put(v))});
const kvGet=async(k,d)=>{try{const v=await dbGet('kv',k);return v===undefined?d:v}catch(e){return d}},kvSet=(k,v)=>dbPut('kv',v,k).catch(()=>{});

const L={tracks:new Map(),pls:[],cache:{}};
async function loadLib(){const t=await dbAll('tracks');L.tracks=new Map(t.map(x=>[x.id,x]));L.pls=await dbAll('playlists');L.cache={}}
const libChanged=()=>{L.cache={}};
const allT=()=>L.cache.all||(L.cache.all=[...L.tracks.values()].filter(t=>!t.hidden));
const saveTrack=t=>dbPut('tracks',t);
const saveTrackSoon=debounce(()=>{},0);
function cmp(k){const s=(a,b)=>String(a||'').localeCompare(String(b||''),'pt-BR',{numeric:true,sensitivity:'base'});
  return({title:(a,b)=>s(a.title,b.title),artist:(a,b)=>s(a.artist,b.artist)||s(a.album,b.album)||(a.no-b.no)||s(a.title,b.title),album:(a,b)=>s(a.album,b.album)||(a.no||0)-(b.no||0)||s(a.title,b.title),added:(a,b)=>b.added-a.added,dur:(a,b)=>b.dur-a.dur,plays:(a,b)=>(b.plays||0)-(a.plays||0)||s(a.title,b.title),year:(a,b)=>(b.year||0)-(a.year||0)})[k]||((a,b)=>s(a.title,b.title))}
function groupBy(arr,keyFn){const m=new Map();for(const t of arr){const k=keyFn(t);if(!m.has(k))m.set(k,[]);m.get(k).push(t)}return m}
function albums(){if(L.cache.albums)return L.cache.albums;const g=groupBy(allT().filter(t=>!t.video),t=>norm(t.albumArtist||t.artist)+'|'+norm(t.album||'Álbum desconhecido'));
  return L.cache.albums=[...g.values()].map(ts=>{ts.sort((a,b)=>(a.disc||0)-(b.disc||0)||(a.no||0)-(b.no||0)||a.title.localeCompare(b.title));const f=ts.find(t=>t.ck)||ts[0];return{key:norm(f.albumArtist||f.artist)+'|'+norm(f.album||'Álbum desconhecido'),name:f.album||'Álbum desconhecido',artist:f.albumArtist||f.artist||'Artista desconhecido',year:f.year,tracks:ts,ck:f.ck,color:f.color,dur:ts.reduce((a,t)=>a+t.dur,0)}}).sort((a,b)=>a.name.localeCompare(b.name,'pt-BR'))}
function artists(){if(L.cache.artists)return L.cache.artists;const g=groupBy(allT().filter(t=>!t.video),t=>norm(t.artist||'Artista desconhecido'));
  return L.cache.artists=[...g.values()].map(ts=>{const f=ts.find(t=>t.ck)||ts[0];return{key:norm(f.artist||'Artista desconhecido'),name:f.artist||'Artista desconhecido',tracks:ts,ck:f.ck,color:f.color,albums:new Set(ts.map(t=>norm(t.album))).size}}).sort((a,b)=>a.name.localeCompare(b.name,'pt-BR'))}
function genres(){if(L.cache.genres)return L.cache.genres;const g=groupBy(allT().filter(t=>!t.video),t=>t.genre||'Sem gênero');
  return L.cache.genres=[...g.entries()].map(([n,ts])=>({key:norm(n),name:n,tracks:ts,ck:(ts.find(t=>t.ck)||{}).ck,color:hashColor(n)})).sort((a,b)=>b.tracks.length-a.tracks.length)}
function folders(){if(L.cache.folders)return L.cache.folders;const g=groupBy(allT(),t=>t.folder||'Importadas');
  return L.cache.folders=[...g.entries()].map(([n,ts])=>({key:norm(n),name:n,tracks:ts,ck:(ts.find(t=>t.ck)||{}).ck})).sort((a,b)=>a.name.localeCompare(b.name,'pt-BR'))}
const favs=()=>allT().filter(t=>t.fav);
function smartLists(){const a=allT();return[
 {id:'s:fav',name:'Favoritas',icon:'heart',color:'#ff4d8d',get:()=>a.filter(t=>t.fav).sort(cmp('title'))},
 {id:'s:top',name:'Mais tocadas',icon:'chart',color:'#ff9f45',get:()=>a.filter(t=>t.plays>0).sort(cmp('plays')).slice(0,100)},
 {id:'s:recent',name:'Tocadas recentemente',icon:'timer',color:'#38c6ff',get:()=>a.filter(t=>t.last).sort((x,y)=>y.last-x.last).slice(0,100)},
 {id:'s:new',name:'Adicionadas recentemente',icon:'plus',color:'#6ee7a0',get:()=>[...a].sort(cmp('added')).slice(0,100)},
 {id:'s:never',name:'Nunca ouvidas',icon:'note',color:'#b28cff',get:()=>a.filter(t=>!t.plays).sort(cmp('added'))},
 {id:'s:hires',name:'Hi-Res',icon:'star',color:'#ffd24d',get:()=>a.filter(t=>t.hires).sort(cmp('title'))},
 {id:'s:rated',name:'Mais bem avaliadas',icon:'star',color:'#ff7a59',get:()=>a.filter(t=>t.rating>=4).sort((x,y)=>y.rating-x.rating)}]}
function listTracks(id){if(!id)return[];if(id.startsWith('s:')){const s=smartLists().find(x=>x.id===id);return s?s.get():[]}const p=L.pls.find(x=>x.id===id);return p?p.ids.map(i=>L.tracks.get(i)).filter(Boolean):[]}

const coverURLs=new Map();
async function getCoverURL(ck){if(!ck)return null;if(coverURLs.has(ck))return coverURLs.get(ck);const r=await dbGet('covers',ck).catch(()=>null);const u=r&&r.blob?URL.createObjectURL(r.blob):null;coverURLs.set(ck,u);return u}
function cvStyle(t){const c=t.color||hashColor(t.album||t.artist||t.title||t.name);return`--c1:${c};--c2:${hsl2hex(rgb2hsl(...hex2rgb(c))[0]+40,.5,.3)}`}
const cvHTML=(t,cls='',icon=true)=>`<div class="cv ${cls}" data-ck="${esc(t.ck||'')}" style="${cvStyle(t)}">${t.ck?'':`<i>${ic('note',22)}</i>`}</div>`;
const IOV=new IntersectionObserver(es=>{for(const e of es)if(e.isIntersecting){IOV.unobserve(e.target);const el=e.target,ck=el.dataset.ck;getCoverURL(ck).then(u=>{if(u){el.style.backgroundImage=`url("${u}")`;el.classList.add('has');const i=el.querySelector('i');if(i)i.remove()}})}},{rootMargin:'400px'});
function hydrate(root=document){(root.matches&&root.matches('.cv[data-ck]')?[root]:root.querySelectorAll('.cv[data-ck]')).forEach(el=>{if(el.dataset.h)return;el.dataset.h=1;if(el.dataset.ck)IOV.observe(el)})}
function mosaic(tracks,cls=''){const u=[];const seen=new Set();for(const t of tracks){if(t.ck&&!seen.has(t.ck)){seen.add(t.ck);u.push(t)}if(u.length>=4)break}
  if(u.length<4)return u.length?cvHTML(u[0],cls):cvHTML({title:'?'},cls);return`<div class="mos ${cls}">${u.map(t=>cvHTML(t)).join('')}</div>`}

    pk[i]=Math.max(h,(pk[i]||0)-1.2*dpr);g.fillStyle=vzC(i*2,88,.9);vzRR(g,x,base-pk[i]-7*dpr,w,3*dpr,1.5*dpr);g.fill()}}
/* onda: três camadas translúcidas e fluidas, com linha brilhante na frente */
function vzWave(g,d,W,H,dpr){const n=40,s=vzBands(d,n),P=56,base=H*.88,mh=Math.min(H*.36,170*dpr);
  const amp=new Float32Array(P+1);
  for(let p=0;p<=P;p++){const u=Math.abs(p-P/2)/(P/2),f=u*(n-1),a=Math.floor(f),b=Math.min(n-1,a+1),t=f-a;amp[p]=Math.max(.05,s[a]*(1-t)+s[b]*t)*Math.pow(Math.sin(Math.PI*p/P),.7)}
  const LY=[{k:1,dh:0,a:.5,sp:.7,ph:0,w:1.5},{k:.72,dh:28,a:.55,sp:1.05,ph:2.1,w:2},{k:.48,dh:56,a:.65,sp:1.5,ph:4.2,w:3}];
  LY.forEach((l,li)=>{const pts=[];for(let p=0;p<=P;p++){const wob=.7+.3*Math.sin(p*.42+VZ.t*l.sp*2+l.ph);pts.push([p/P*W,base-amp[p]*mh*l.k*wob])}
    const path=new Path2D();path.moveTo(pts[0][0],pts[0][1]);
    for(let p=1;p<P;p++){path.quadraticCurveTo(pts[p][0],pts[p][1],(pts[p][0]+pts[p+1][0])/2,(pts[p][1]+pts[p+1][1])/2)}
    path.lineTo(pts[P][0],pts[P][1]);
    const fill=new Path2D(path);fill.lineTo(W,H);fill.lineTo(0,H);fill.closePath();
    const gr=g.createLinearGradient(0,base-mh*l.k,0,H);gr.addColorStop(0,vzC(l.dh,66,l.a*.55));gr.addColorStop(1,vzC(l.dh,45,0));g.fillStyle=gr;g.fill(fill);
    const lg=g.createLinearGradient(0,0,W,0);lg.addColorStop(0,vzC(l.dh,70,.05));lg.addColorStop(.25,vzC(l.dh+20,74,.9));lg.addColorStop(.75,vzC(l.dh+50,74,.9));lg.addColorStop(1,vzC(l.dh+70,70,.05));
    g.strokeStyle=lg;g.lineWidth=l.w*dpr;if(li===2){g.shadowColor=vzC(l.dh+20,70,.9);g.shadowBlur=16*dpr}g.stroke(path);g.shadowBlur=0})}
/* circular: barras radiais simétricas ao redor do disco, halo e anel que pulsam com os graves */
function vzCircle(g,d,W,H,dpr,cv){const n=44,s=vzBands(d,n);let cx=W/2,cy=H/2,rad=Math.min(W,H)*.3;const de=$('#disc');
  if(de&&!de.hidden){const dr=de.getBoundingClientRect(),cr=cv.getBoundingClientRect();if(dr.width){cx=(dr.left+dr.width/2-cr.left)*dpr;cy=(dr.top+dr.height/2-cr.top)*dpr;rad=dr.width/2*dpr}}
  const r0=rad+14*dpr,room=Math.min(cx,W-cx,cy,H-cy)-r0-3*dpr,Lm=Math.max(10*dpr,Math.min(room,rad*.42));
  VZ.bass+=((s[0]+s[1]+s[2]+s[3])/4-VZ.bass)*.25;const B=VZ.bass;
  const hg=g.createRadialGradient(cx,cy,r0-6*dpr,cx,cy,r0+Lm*1.3);hg.addColorStop(0,vzC(0,60,.1+B*.3));hg.addColorStop(1,vzC(0,50,0));g.fillStyle=hg;g.beginPath();g.arc(cx,cy,r0+Lm*1.3,0,Math.PI*2);g.fill();
  g.lineWidth=2*dpr;g.strokeStyle=vzC(20,75,.3+B*.5);g.beginPath();g.arc(cx,cy,r0-5*dpr,0,Math.PI*2);g.stroke();
  const N=n*2,bw=Math.max(2*dpr,2*Math.PI*r0/N*.56);
  for(let pass=0;pass<2;pass++){g.lineWidth=pass?bw:bw*2.4;
    for(let k=0;k<N;k++){const m=k<=n?k:N-k,idx=Math.min(n-1,n-m),v=s[idx],th=k/N*Math.PI*2-Math.PI/2,c=Math.cos(th),sn=Math.sin(th),len=3*dpr+v*Lm;
      g.strokeStyle=vzC(idx*2.4,70,pass?.9:.14);g.beginPath();g.moveTo(cx+c*r0,cy+sn*r0);g.lineTo(cx+c*(r0+len),cy+sn*(r0+len));g.stroke()}}}

/* ================= listas virtualizadas ================= */
const VLS=new Set();
function vlist(host,n,rowH,render,scroller){
  host.style.position='relative';host.style.height=n*rowH+'px';const pool=new Map();
  function upd(){if(!host.isConnected){VLS.delete(api);scroller.removeEventListener('scroll',upd);return}const r=host.getBoundingClientRect(),sr=scroller.getBoundingClientRect();if(!sr.height)return;
    const top=Math.max(0,sr.top-r.top-rowH*5),bot=sr.bottom-r.top+rowH*5,a=Math.max(0,Math.floor(top/rowH)),b=Math.min(n,Math.ceil(bot/rowH));
    for(const[i,el]of pool)if(i<a||i>=b){el.remove();pool.delete(i)}
    for(let i=a;i<b;i++)if(!pool.has(i)){const el=render(i);el.style.cssText+=`;position:absolute;left:0;right:0;top:${i*rowH}px;height:${rowH}px`;host.appendChild(el);pool.set(i,el)}}
  const api={upd,refresh(){pool.forEach(e=>e.remove());pool.clear();upd()}};
  scroller.addEventListener('scroll',upd,{passive:true});VLS.add(api);requestAnimationFrame(upd);setTimeout(upd,120);return api}

function openEditor(id){const t=L.tracks.get(id);if(!t)return;const f=(k,l,ty='text')=>`<label class="fld"><span>${l}</span><input data-k="${k}" type="${ty}" value="${esc(t[k]||'')}"></label>`;

async function fetchLyrics(t){try{const u=`https://lrclib.net/api/get?artist_name=${encodeURIComponent(t.artist||'')}&track_name=${encodeURIComponent(t.title)}&album_name=${encodeURIComponent(t.album||'')}&duration=${Math.round(t.dur)}`;let r=await fetch(u);if(!r.ok){r=await fetch(`https://lrclib.net/api/search?q=${encodeURIComponent((t.artist||'')+' '+t.title)}`);if(!r.ok)return null;const a=await r.json();const x=a&&a[0];return x?(x.syncedLyrics||x.plainLyrics):null}const j=await r.json();return j.syncedLyrics||j.plainLyrics||null}catch(e){return null}}

const EQ_HUE=i=>330-i*15.5,EQ_LBL=['32','64','125','250','500','1k','2k','4k','8k','16k'];
function openEQ(){
  openPage('Equalizador',(body,pg)=>{
    const Offline=window.OfflineAudioContext||window.webkitOfflineAudioContext;

    if(Offline){const oc=new Offline(1,1,44100);fs=EQF.map((f,i)=>{const b=oc.createBiquadFilter();b.type=i===0?'lowshelf':i===9?'highshelf':'peaking';b.frequency.value=f;b.Q.value=1.05;return b})}
    const N=180,fr=new Float32Array(N),mag=new Float32Array(N),ph=new Float32Array(N),tot=new Float32Array(N);for(let i=0;i<N;i++)fr[i]=20*Math.pow(1000,i/(N-1));

    pg._clean.push(()=>{dead=true});

    const fxLab=(k,v)=>k==='balance'?(v===0?'Centro':(v<0?'E ':'D ')+Math.round(Math.abs(v)*100)+'%'):k==='pre'?fmtG(+v)+' dB':v+'%';

    /* gráfico: espectro ao vivo + curva de resposta */
    const paint=()=>{const cv=$('#eqCv',body);if(!cv)return;const dpr=2,W=Math.max(1,Math.round(cv.clientWidth*dpr)),H=Math.max(1,Math.round(cv.clientHeight*dpr));if(cv.width!==W)cv.width=W;if(cv.height!==H)cv.height=H;
      const g=cv.getContext('2d');g.clearRect(0,0,W,H);const cs=getComputedStyle(document.documentElement),acc=(cs.getPropertyValue('--acc').trim()||'#8b7bff'),mut=cs.getPropertyValue('--mut').trim()||'#999';
      const x0=34*dpr,x1=W-10*dpr,top=12*dpr,bot=H-22*dpr,ym=(top+bot)/2,hh=(bot-top)/2,X=f=>x0+Math.log(f/20)/Math.log(1000)*(x1-x0),Y=db=>ym-db/14*hh;
      g.font=`${10*dpr}px system-ui,sans-serif`;g.fillStyle=mut;g.strokeStyle=mut;g.lineWidth=dpr;

      g.textAlign='center';g.textBaseline='alphabetic';[[50],[100,'100'],[200],[500],[1000,'1k'],[2000],[5000],[10000,'10k']].forEach(([f,l])=>{g.globalAlpha=.12;g.beginPath();g.moveTo(X(f),top);g.lineTo(X(f),bot);g.stroke();if(l){g.globalAlpha=.75;g.fillText(l,X(f),H-6*dpr)}});g.globalAlpha=1;

async function exportBackup(){const h=await dbAll('history');const data={v:2,when:Date.now(),settings:S,playlists:L.pls,tracks:[...L.tracks.values()].map(t=>({key:t.key,title:t.title,fav:t.fav,rating:t.rating,plays:t.plays,last:t.last,lrc:t.lrc,lyrics:t.lyrics,artist:t.artist,album:t.album,genre:t.genre,year:t.year,no:t.no,id:t.id})),history:h};download('minha-musica-backup.json',JSON.stringify(data),'application/json');toast('Backup exportado')}
async function importBackup(f){try{const d=JSON.parse(await f.text());const byKey=new Map([...L.tracks.values()].map(t=>[t.key,t]));const idMap=new Map();
  for(const x of d.tracks||[]){const t=byKey.get(x.key);if(t){idMap.set(x.id,t.id);Object.assign(t,{fav:x.fav,rating:x.rating,plays:x.plays,last:x.last,lrc:x.lrc||t.lrc,lyrics:x.lyrics||t.lyrics,title:x.title||t.title,artist:x.artist,album:x.album,genre:x.genre,year:x.year,no:x.no});await saveTrack(t)}}
  for(const p of d.playlists||[]){if(!L.pls.some(q=>q.id===p.id)){p.ids=p.ids.map(i=>idMap.get(i)||i).filter(i=>L.tracks.has(i));L.pls.push(p);await savePl(p)}}
  if(d.settings){S={...S,...d.settings,eq:{...S.eq,...d.settings.eq}};saveS();applyTheme()}libChanged();refreshAll();toast('Backup restaurado')}catch(e){toast('Arquivo de backup inválido')}}
function findDups(){const g=groupBy(allT(),t=>norm(t.title)+'|'+norm(t.artist)+'|'+Math.round(t.dur/2));const d=[...g.values()].filter(x=>x.length>1);
  if(!d.length){toast('Nenhuma duplicada encontrada');return}
  openPage('Duplicadas',(body,pg)=>{body.innerHTML=`<div class="mut pad">${d.length} grupos de músicas parecidas. Toque no “⋮” para remover a repetida.</div>`+d.map(x=>`<div class="sech pad"><h3>${esc(x[0].title)}</h3></div>${rowsHTML(x,'Duplicadas')}`).join('');hydrate(body)})}

/* ================= estatísticas ================= */
async function openStats(){const h=await dbAll('history');
  openPage('Estatísticas',(body,pg)=>{let per=7;const draw=()=>{const since=per?Date.now()-per*864e5:0,H=h.filter(x=>x.t>=since);const tot=H.reduce((a,x)=>a+x.sec,0);
    const agg=(k)=>{const m=new Map();for(const x of H){const key=x[k]||'—';m.set(key,(m.get(key)||0)+x.sec)}return[...m.entries()].sort((a,b)=>b[1]-a[1]).slice(0,5)};
    const cnt=new Map();for(const x of H)cnt.set(x.id,(cnt.get(x.id)||0)+1);const tops=[...cnt.entries()].sort((a,b)=>b[1]-a[1]).slice(0,5).map(([id,n])=>[L.tracks.get(id),n]).filter(x=>x[0]);
    const wd=Array(7).fill(0);for(const x of H)wd[new Date(x.t).getDay()]+=x.sec;const mx=Math.max(1,...wd);const days=new Set(H.map(x=>new Date(x.t).toDateString()));
    const bars=(arr,fmt)=>arr.length?arr.map(([n,v],i)=>`<div class="bar"><span>${i+1}. ${esc(n)}</span><div><i style="width:${v/arr[0][1]*100}%"></i></div><b>${fmt(v)}</b></div>`).join(''):'<p class="mut sm">Sem dados ainda — ouça algumas músicas.</p>';
    body.innerHTML=`<div class="chips">${[[7,'7 dias'],[30,'30 dias'],[0,'Tudo']].map(([v,n])=>`<button class="chip${per===v?' on':''}" data-per="${v}">${n}</button>`).join('')}</div>
    <div class="grid2 pad"><div class="tile"><small>Tempo ouvido</small><b>${fmtDur(tot)}</b></div><div class="tile"><small>Reproduções</small><b>${H.length}</b></div><div class="tile"><small>Dias ativos</small><b>${days.size}</b></div><div class="tile"><small>Músicas diferentes</small><b>${cnt.size}</b></div></div>
    <div class="card"><h4>Por dia da semana</h4><div class="wk">${wd.map((v,i)=>`<div><i style="height:${v/mx*100}%"></i><small>${'DSTQQSS'[i]}</small></div>`).join('')}</div></div>
    <div class="card"><h4>Artistas mais ouvidos</h4>${bars(agg('artist'),fmtDur)}</div><div class="card"><h4>Gêneros</h4>${bars(agg('genre'),fmtDur)}</div><div class="card"><h4>Álbuns</h4>${bars(agg('album'),fmtDur)}</div>
    <div class="card"><h4>Músicas mais tocadas</h4>${tops.length?rowsHTML(tops.map(x=>x[0]),'Mais tocadas'):'<p class="mut sm">Sem dados ainda.</p>'}</div>`;hydrate(body);$$('[data-per]',body).forEach(b=>b.onclick=()=>{per=+b.dataset.per;draw()})};draw()})}

/* ================= formatos / sobre / perfil / carro ================= */
function openFormats(){const v=document.createElement('video');const rows=[['MP3','audio/mpeg'],['AAC / M4A','audio/mp4; codecs="mp4a.40.2"'],['FLAC','audio/flac'],['OGG Vorbis','audio/ogg; codecs="vorbis"'],['Opus','audio/ogg; codecs="opus"'],['WAV / PCM','audio/wav'],['ALAC (Apple Lossless)','audio/mp4; codecs="alac"'],['AIFF','audio/aiff'],['WebM áudio','audio/webm; codecs="opus"'],['MP4 (vídeo)','video/mp4; codecs="avc1.42E01E"'],['WebM (vídeo)','video/webm; codecs="vp9"'],['MKV','video/x-matroska'],['WMA','audio/x-ms-wma'],['APE / DSD / WavPack','audio/x-ape']];
  openPage('Formatos suportados',(body,pg)=>{body.innerHTML=`<p class="mut pad">O app usa o decodificador do seu aparelho. Esta lista mostra o que ele consegue tocar agora:</p><div class="card">${rows.map(([n,m])=>{const r=v.canPlayType(m);return`<div class="ir"><span>${n}</span><b class="${r?'ok':'no'}">${r==='probably'?'✓ Suportado':r?'✓ Provável':'✕ Não suportado'}</b></div>`}).join('')}</div><p class="mut sm pad">Formatos não suportados (como WMA, APE e DSD) são ignorados na importação, a menos que você ative “Importar formatos não suportados”. Músicas que falharem ao tocar são puladas automaticamente.</p>`})}
function openAbout(){openPage('Sobre',(body,pg)=>{body.innerHTML=`<div class="card"><h4>Minha Música Hi-Fi</h4><p class="mut sm">Player offline com biblioteca salva no aparelho, equalizador de 10 bandas, som espacial 3D, crossfade, letras sincronizadas, timer do sono, playlists inteligentes, estatísticas, modo carro e controles na tela de bloqueio.</p><p class="mut sm">Atalhos (computador): Espaço play/pausa · ← → avançar/voltar 5 s · N próxima · P anterior · M mudo.</p></div>`})}
function openProfile(){const G=['Sertanejo','Pop','Rock','Funk','Gospel','MPB','Forró','Pagode','Samba','Eletrônica','Rap','Hip Hop','Clássica','Jazz','Reggae','Country','Lo-fi','Axé','Metal','Blues'];
  openSheet(`<h3 class="shT">Seu perfil</h3><label class="fld"><span>Como posso te chamar?</span><input id="pfName" value="${esc(S.name)}" maxlength="30" autocomplete="given-name"></label><div class="mut sm pad0">Gostos musicais (usados em “Feito para você”)</div><div class="chips wrap">${G.map(g=>`<button class="chip${S.genres.includes(g)?' on':''}" data-g="${g}">${g}</button>`).join('')}</div><div class="row end"><button class="btn p" id="pfOk">Salvar</button></div>`);
  $$('[data-g]').forEach(b=>b.onclick=()=>b.classList.toggle('on'));$('#pfOk').onclick=async()=>{S.name=$('#pfName').value.trim();S.genres=$$('[data-g].on').map(b=>b.dataset.g);saveS();await closeTop();refreshAll();renderMore();try{localStorage.setItem('mm_asked','1')}catch(e){}}}
function openCar(){if(Q.idx<0){toast('Toque uma música primeiro');return}const c=$('#car');c.hidden=false;pushLayer(()=>{c.hidden=true});if(navigator.wakeLock)navigator.wakeLock.request('screen').then(w=>c._wl=w).catch(()=>{})}
ACT.carClose=()=>history.back();

/* ================= sono / velocidade ================= */
function openSleep(){const r=SL.mode==='time'?Math.max(0,Math.ceil((SL.end-Date.now())/60000)):0;
  openSheet(`<h3 class="shT">Timer do sono</h3>${SL.mode?`<div class="mut pad0">${SL.mode==='time'?`Pausa em ${r} min`:SL.mode==='track'?'Pausa ao fim da faixa':'Pausa ao fim da fila'}</div>`:''}<div class="menu">${[15,30,45,60,90,120].map(m=>`<button class="mi" data-act="slTime" data-m="${m}">${ic('timer',22)}<span>${m} minutos</span></button>`).join('')}<button class="mi" data-act="slTrack">${ic('note',22)}<span>Ao fim da faixa atual</span></button><button class="mi" data-act="slQueue">${ic('queue',22)}<span>Ao fim da fila</span></button>${SL.mode?`<button class="mi" data-act="slOff">${ic('close',22)}<span>Desligar timer</span></button>`:''}</div><label class="sw row2"><input type="checkbox" id="slFade" ${S.sleepFade?'checked':''}><i></i><span>Diminuir volume no final</span></label>`);$('#slFade').onchange=e=>{S.sleepFade=e.target.checked;saveS()}}
ACT.slTime=async el=>{await closeTop();setSleep('time',+el.dataset.m)};ACT.slTrack=async()=>{await closeTop();setSleep('track')};ACT.slQueue=async()=>{await closeTop();setSleep('queue')};ACT.slOff=async()=>{await closeTop();setSleep(null)};
function openSpeed(){openSheet(`<h3 class="shT">Velocidade e repetição A–B</h3><div class="chips wrap">${[.5,.75,1,1.25,1.5,1.75,2].map(x=>`<button class="chip${S.speed===x?' on':''}" data-sp="${x}">${x}x</button>`).join('')}</div><label class="slr"><span>Velocidade</span><b id="spV">${S.speed}x</b><input type="range" id="spR" min="0.5" max="2" step="0.05" value="${S.speed}"></label><p class="mut sm">O tom é preservado ao mudar a velocidade.</p><h4>Repetir trecho (A–B)</h4><div class="btns"><button class="btn" id="abA">Marcar A</button><button class="btn" id="abB">Marcar B</button><button class="btn" id="abX">Limpar</button></div><div class="mut sm" id="abT">${A.ab?`A ${fmtT(A.ab.a||0)} → B ${A.ab.b?fmtT(A.ab.b):'—'}`:'Sem trecho definido'}</div>`);
  const up=()=>{$('#abT').textContent=A.ab?`A ${fmtT(A.ab.a||0)} → B ${A.ab.b?fmtT(A.ab.b):'—'}`:'Sem trecho definido';uiAB()};
  $$('[data-sp]').forEach(b=>b.onclick=()=>{setSpeed(+b.dataset.sp);$('#spR').value=S.speed;$('#spV').textContent=S.speed+'x';$$('[data-sp]').forEach(x=>x.classList.toggle('on',x===b))});$('#spR').oninput=e=>{setSpeed(+e.target.value);$('#spV').textContent=S.speed+'x'};
  $('#abA').onclick=()=>{const el=A.el[A.cur];if(!el||!el.src){toast('Toque uma música antes de marcar o trecho');return}A.ab={a:el.currentTime,b:0};up()};$('#abB').onclick=()=>{const el=A.el[A.cur];if(!el||!el.src){toast('Toque uma música antes de marcar o trecho');return}if(!A.ab)A.ab={a:0};A.ab.b=el.currentTime;up()};$('#abX').onclick=()=>{A.ab=null;up()}}

/* ================= conexões dos controles ================= */
function bindStatic(){
  $$('#nav button').forEach(b=>b.onclick=()=>{if(UI.tab===b.dataset.t){$('#pages').scrollTo({top:0,behavior:'smooth'});return}goTab(b.dataset.t)});
  $$('[data-ic]').forEach(e=>e.innerHTML=ic(e.dataset.ic,+e.dataset.s||24));swipe($('#mMain'),{left:next,right:prev,tap:openPlayer});
  $('#mPlay').onclick=e=>{e.stopPropagation();toggle()};$('#mNext').onclick=e=>{e.stopPropagation();next()};
  $('#pClose').onclick=()=>history.back();$('#pMore').onclick=()=>{const id=Q.list[Q.idx];if(id)openPlayerMenu(id)};
  $('#bPlay').onclick=toggle;$('#bNext').onclick=next;$('#bPrev').onclick=prev;$('#bShuf').onclick=toggleShuffle;$('#bRep').onclick=cycleRepeat;$('#pFav').onclick=()=>toggleFav(Q.list[Q.idx]);
  const vr=$('#volSlider');vr.oninput=()=>setVolume(+vr.value);
  $('#bEq').onclick=openEQ;$('#bTimer').onclick=openSleep;$('#bSpeed').onclick=openSpeed;$('#bOut').onclick=openOutput;$('#bLyr').onclick=()=>pView(UI.view==='lyrics'?'cover':'lyrics');$('#bQ').onclick=()=>pView(UI.view==='queue'?'cover':'queue');
  const sk=$('#seek');sk.oninput=()=>{SEEK.drag=true;const el=A.el[A.cur];if(el&&el.duration){$('#tCur').textContent=fmtT(sk.value/1000*el.duration);sk.style.setProperty('--p',sk.value/10+'%')}};sk.onchange=()=>{const el=A.el[A.cur];if(el&&el.duration)seek(sk.value/1000*el.duration);SEEK.drag=false};
  swipe($('#pvCover'),{left:next,right:prev,tap:toggleBlur,dbl:()=>{const id=Q.list[Q.idx];if(id){toggleFav(id);const h=$('#heartPop');h.classList.remove('go');void h.offsetWidth;h.classList.add('go')}}});
  $('#carPlay').onclick=toggle;$('#carNext').onclick=next;$('#carPrev').onclick=prev;
  $('#inFiles').onchange=e=>{const f=[...e.target.files];e.target.value='';if(f.length)importFiles(f)};$('#inDir').onchange=e=>{const f=[...e.target.files];e.target.value='';if(f.length)importFiles(f,{any:!!S.scanAny,title:'Importando da pasta'})};
  $('#qclear').onclick=()=>{const cur=Q.list[Q.idx];Q.list=[cur];Q.orig=[cur];Q.idx=0;renderQueue();savePlayState();toast('Fila limpa')};
  /* arrastar e soltar (computador) */
  let dc=0;addEventListener('dragenter',e=>{e.preventDefault();dc++;$('#drop').hidden=false});addEventListener('dragleave',e=>{dc--;if(dc<=0){dc=0;$('#drop').hidden=true}});addEventListener('dragover',e=>e.preventDefault());
  addEventListener('drop',async e=>{e.preventDefault();dc=0;$('#drop').hidden=true;const it=e.dataTransfer.items;let files=[];if(it&&it.length&&it[0].webkitGetAsEntry)files=await entriesToFiles([...it]);else files=[...e.dataTransfer.files];if(files.length)importFiles(files)});
  /* teclado */
  addEventListener('keydown',e=>{if(/INPUT|TEXTAREA|SELECT/.test((e.target.tagName||'')))return;const el=A.el[A.cur];if(e.code==='Space'){e.preventDefault();toggle()}else if(e.key==='ArrowRight'&&el)seek(el.currentTime+5);else if(e.key==='ArrowLeft'&&el)seek(el.currentTime-5);else if(e.key==='n'||e.key==='N')next();else if(e.key==='p'||e.key==='P')prev();else if(e.key==='m'||e.key==='M'){setVolume(S.vol>0?0:90,{warn:false})}});
  new ResizeObserver(updBot).observe($('#nav'));new ResizeObserver(updBot).observe($('#mini'))}
function openPlayerMenu(id){const t=L.tracks.get(id);openTrackMenu(id,{player:true})}
ACT['m-car']=async()=>{await closeTop();openCar()};ACT['m-eq']=async()=>{await closeTop();openEQ()};ACT['m-blur']=async()=>{await closeTop();toggleBlur()};ACT['m-viz']=async()=>{const o=['bars','wave','circle','off'];S.viz=o[(o.indexOf(S.viz)+1)%4];saveS();startViz();toast('Visualizador: '+{bars:'barras',wave:'onda',circle:'circular',off:'desligado'}[S.viz])};
ACT['m-disc']=async()=>{S.discStyle=S.discStyle==='disc'?'sq':'disc';saveS();applyDisc();await closeTop()};
ACT['m-unq']=async el=>{const i=+el.dataset.i;const cur=Q.idx,removed=Q.list[i];Q.list.splice(i,1);const oi=Q.orig.indexOf(removed);if(oi>=0)Q.orig.splice(oi,1);if(i<cur)Q.idx--;else if(i===cur){await closeTop();if(Q.list.length)goto(Math.min(i,Q.list.length-1),{autoplay:A.playing});return}await closeTop();renderQueue();savePlayState()};

/* ================= início ================= */
async function init(){
  try{await openDB()}catch(e){toast('Não foi possível abrir o banco de dados local');return}
  await loadS();await loadLib();await primeCoverSeen();bindStatic();initMS();applyDisc();applyPrivacy();
  const st=await kvGet('state',null);
  if(st&&st.list&&st.list.length){Q.list=st.list.filter(id=>L.tracks.has(id));Q.orig=(st.orig||[]).filter(id=>L.tracks.has(id));Q.shuffle=!!st.shuffle;Q.repeat=st.repeat||'off';Q.src=st.src||'';const cur=st.list[st.idx];Q.idx=Math.max(0,Q.list.indexOf(cur));Q.pos=st.pos||0;
    const t=L.tracks.get(Q.list[Q.idx]);if(t){uiTrack(t);if(t.dur)$('#mBar').style.width=(Q.pos/t.dur*100)+'%'}}
  updShuffleUI();uiPlaying();uiSpeed();uiSleep();syncVolumeUI();goTab('home');pView('cover');updBot();
  if(!S.name&&!(()=>{try{return localStorage.getItem('mm_asked')}catch(e){return 0}})()&&!L.tracks.size)setTimeout(openProfile,700);
  setTimeout(()=>rescanFolders(false),1500);
  if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
}
window.addEventListener('DOMContentLoaded',init);

</script>
